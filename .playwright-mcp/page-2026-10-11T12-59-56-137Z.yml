            - heading "The problem" [level=2] [ref=f1e58]
            - paragraph [ref=f1e59]: An agency serving many clients has the same reporting conversation every month. Clients want to see their own performance; the agency wants one pipeline across all of them.
          - generic [ref=f1e60]:
            - heading "What was built" [level=2] [ref=f1e61]
            - paragraph [ref=f1e62]: Each client gets a portal scoped to their own account, while the agency works a shared pipeline behind it. Reporting pulls real numbers from the Google Analytics Data API rather than being re-keyed, and an AI assistant helps summarise account activity.
          - generic [ref=f1e63]:
            - heading "Technical notes" [level=2] [ref=f1e64]
            - paragraph [ref=f1e65]: Prisma over PostgreSQL with Auth.js for multi-tenant access control. The repo is held to unit, integration and end-to-end tests plus Lighthouse CI and bundle-size checks.
          - paragraph [ref=f1e66]: The portal is authenticated, so the capture shows the sign-in screen rather than client data.
